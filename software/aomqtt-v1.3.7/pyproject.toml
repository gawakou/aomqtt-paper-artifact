[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aomqtt-client-sdk"
version = "1.3.7"
description = "AOMQTT Client SDK: hardened research prototype for observation-driven MQTT policy control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "paho-mqtt>=1.6",
  "cryptography>=41.0",
  "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["aomqtt*"]
