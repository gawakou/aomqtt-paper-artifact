# AOMQTT Docker local-experiment broker configuration.
#
# The broker listens on all interfaces inside the container so Docker port
# forwarding can reach it.  docker-compose.yml binds the host-side published
# port to 127.0.0.1, so it remains a localhost-only experiment broker.
# Do not use this configuration on a shared server without TLS, authentication,
# and ACLs.

listener 1883 0.0.0.0
allow_anonymous true
log_type all
